name: Generate profile stats cards

on:
  schedule:
    - cron: "30 0 * * *" # daily
  workflow_dispatch: # allow manual runs from the Actions tab
  push:
    branches: [main]
    paths: [".github/workflows/profile-stats.yml"]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Generate profile summary cards
        uses: vn7n24fzkq/github-profile-summary-cards@release/v2
        env:
          # Default token sees public activity only. For private-contribution
          # counts, add a PAT (repo + read:user) as a secret named README_TOKEN.
          GITHUB_TOKEN: ${{ secrets.README_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}

name: Generate profile stats cards

on:
  schedule:
    - cron: "0 0 * * *" # once a day, 00:00 UTC
  workflow_dispatch: # allow manual runs from the Actions tab
  push:
    branches: [main]
    paths: [".github/workflows/profile-stats.yml"]

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate profile summary cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          # Recommended: a personal access token (scopes: repo, read:user) saved as the
          # repo secret SUMMARY_GITHUB_TOKEN. Falls back to the built-in token if unset.
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: "main"
          AUTO_PUSH: true
